name: CI

# Runs vet, tests and govulncheck on every push and PR.
# The `ci-ok` job always reports and is the single required status check on main.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'
  GOVULNCHECK_VERSION: 'v1.9.0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vulnerability check
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  # Carried over from the old test.yaml: tests also ran on macOS and Windows.
  test-os:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test
        run: go test ./...

  ci-ok:
    if: always()
    needs: [check, test-os]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_OS_RESULT: ${{ needs.test-os.result }}
        run: |
          echo "check=$CHECK_RESULT test-os=$TEST_OS_RESULT"
          [ "$CHECK_RESULT" = "success" ] || exit 1
          [ "$TEST_OS_RESULT" = "success" ] || exit 1
